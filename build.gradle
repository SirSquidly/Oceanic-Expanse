plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'wtf.gofancy.fancygradle' version '1.1.+'
    id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
    //id 'com.github.johnrengelman.shadow' version '8.1.+'
}

fancyGradle {
    patches {
        resources
        coremods
        asm
        mergetool
    }
}

version = "${project.mod_version}"
group = project.maven_group
archivesBaseName = project.mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: mappings_version
    runs {
        def args = [
                '-Dmixin.debug.export=true',
                '-Dmixin.hotSwap=true',
                '-Dmixin.checks.interfaces=true'
        ]
        client {
            workingDirectory file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'fml.coreMods.load', "${mod_plugin_class},${dependency_plugin_classes}"
            jvmArgs args
        }
        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'fml.coreMods.load', "${mod_plugin_class},${dependency_plugin_classes}"
            jvmArgs args
        }
    }
}

repositories
{
    maven { name = 'CurseForge'; url = uri('https://www.cursemaven.com'); content { includeGroup 'curse.maven' } }
    // Fluidlogged API files
    maven { name = 'GitHub'; url = uri('https://jitpack.io') }
    //JEI files
    maven { name = "DVS1 Maven FS"; url = "http://dvs1.progwml6.com/files/maven"; allowInsecureProtocol = true }
    maven { name = "ModMaven"; url = "http://modmaven.k-4u.nl"; allowInsecureProtocol = true }
    maven { name = 'SpongePowered'; url = uri('https://repo.spongepowered.org/maven') }
}

dependencies
{
    minecraft("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")

    implementation "org.spongepowered:mixin:${mixin_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    implementation(fg.deobf("com.github.jbredwards:fluidlogged-api:${fluidlogged_api_version}"))
    implementation(fg.deobf("curse.maven:had-enough-items-557549:${project.hei_version}"))
    runtimeOnly(fg.deobf("curse.maven:aquaacrobatics-321792:${aqua_acrobatics_version}"))
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

processResources
{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    archiveBaseName = mod_id
	manifest {
        attributes(
                'FMLCorePlugin': "${mod_plugin_class}",
                // SET TO TRUE WHEN BUILDING .JAR!
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'MixinConfigs': "mixins.${mod_id}.json"
        )
    }
}